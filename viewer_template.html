<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D pose — __TITLE__</title>
<style>
  /* Light and dark are both first-class; the system preference picks the
     default and the theme button overrides it for this session. */
  :root {
    color-scheme: light dark;
    --bg:#0d0f13; --panel:#0d0f13; --line:#23262d; --text:#e6e9ef;
    --muted:#7d838f; --faint:#5d636e; --btn:#1a1d24; --btn-hover:#232730;
    --btn-line:#2e323b; --accent:#2b6cb0; --accent-line:#3b82c4; --warn:#ff8a6b;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg:#f4f6f9; --panel:#ffffff; --line:#d9dee6; --text:#1b2029;
    --muted:#5f6875; --faint:#8b94a2; --btn:#ffffff; --btn-hover:#eef1f6;
    --btn-line:#c9d1dc; --accent:#2b6cb0; --accent-line:#2b6cb0; --warn:#c2410c;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      color-scheme: light;
      --bg:#f4f6f9; --panel:#ffffff; --line:#d9dee6; --text:#1b2029;
      --muted:#5f6875; --faint:#8b94a2; --btn:#ffffff; --btn-hover:#eef1f6;
      --btn-line:#c9d1dc; --accent:#2b6cb0; --accent-line:#2b6cb0; --warn:#c2410c;
    }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font:14px/1.4 ui-sans-serif,system-ui,-apple-system,sans-serif; }
  #wrap { display:flex; flex-direction:column; height:100vh; }
  header { padding:10px 16px; border-bottom:1px solid var(--line); display:flex;
           gap:16px; align-items:baseline; flex-wrap:wrap; }
  header h1 { font-size:15px; margin:0; font-weight:600; }
  header .sub { color:var(--muted); font-size:12px; }
  #stage { flex:1; display:flex; min-height:0; }
  .pane { position:relative; min-width:0; min-height:0; flex:1; }
  #videoPane { display:none; border-right:1px solid var(--line); background:#000;
               align-items:center; justify-content:center; }
  #videoPane.on { display:flex; }
  #vidbox { position:relative; max-width:100%; max-height:100%; }
  video { display:block; max-width:100%; max-height:100%; }
  #ovl { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
  canvas#cv { width:100%; height:100%; display:block; cursor:grab; touch-action:none; }
  canvas#cv:active { cursor:grabbing; }
  .tag { position:absolute; top:10px; left:12px; font-size:11px; letter-spacing:.06em;
         text-transform:uppercase; color:var(--faint); pointer-events:none; }
  #hud { position:absolute; top:28px; left:12px; font-size:12px; color:var(--muted);
         pointer-events:none; line-height:1.7; }
  #hud b { color:var(--text); font-variant-numeric:tabular-nums; font-weight:600; }
  #nodet { position:absolute; top:10px; right:14px; font-size:12px; color:var(--warn);
           display:none; }
  footer { border-top:1px solid var(--line); padding:10px 16px 14px;
           display:flex; flex-direction:column; gap:10px; background:var(--panel); }
  .row { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  button { background:var(--btn); color:var(--text); border:1px solid var(--btn-line);
           border-radius:6px; padding:6px 12px; font:inherit; cursor:pointer; }
  button:hover { background:var(--btn-hover); }
  button.on { background:var(--accent); border-color:var(--accent-line); color:#fff; }
  button:disabled { opacity:.45; cursor:default; }
  input[type=range] { flex:1; min-width:180px; accent-color:#4a9eff; }
  label { color:var(--muted); font-size:12px; display:flex; gap:6px; align-items:center; }
  select { background:var(--btn); color:var(--text); border:1px solid var(--btn-line);
           border-radius:6px; padding:5px 8px; font:inherit; }
  @media (max-width: 820px) { #stage { flex-direction:column; }
    #videoPane { border-right:none; border-bottom:1px solid var(--line); } }
</style>
</head>
<body>
<div id="wrap">
  <header>
    <h1>3D pose — __TITLE__</h1>
    <span class="sub"><span id="camhint">camera locked at the real camera's position</span> · space to play · ←/→ step</span>
  </header>
  <div id="stage">
    <div class="pane" id="videoPane">
      <div id="vidbox">
        <video id="vid" playsinline muted preload="auto"></video>
        <canvas id="ovl"></canvas>
      </div>
      <div class="tag">source + 2D overlay</div>
    </div>
    <div class="pane">
      <canvas id="cv"></canvas>
      <div class="tag" id="panetag">3D scene — fixed camera</div>
      <div id="hud"></div>
      <div id="nodet">no pose detected in this frame</div>
    </div>
  </div>
  <footer>
    <div class="row">
      <button id="play">▶ play</button>
      <input type="range" id="scrub" min="0" value="0" step="1">
      <span id="fcount" style="color:#7d838f;font-variant-numeric:tabular-nums"></span>
    </div>
    <div class="row">
      <label>speed
        <select id="speed">
          <option value="0.25">0.25×</option>
          <option value="0.5">0.5×</option>
          <option value="1" selected>1×</option>
          <option value="2">2×</option>
        </select>
      </label>
      <label>trail
        <select id="trailsel">
          <option value="" selected>off</option>
          <option value="0">nose</option>
          <option value="15">left wrist</option>
          <option value="16">right wrist</option>
          <option value="27">left ankle</option>
          <option value="28">right ankle</option>
          <option value="com">hip centre</option>
        </select>
      </label>
      <label>camera
        <select id="cammode">
          <option value="fixed">fixed — real camera</option>
          <option value="follow">follow — orbit</option>
        </select>
      </label>
      <button id="solid" class="on">solid</button>
      <button id="ghost">ghosts</button>
      <button id="grid" class="on">scene</button>
      <button id="overlay" class="on">2D overlay</button>
      <button id="reset" title="back to the real camera's viewpoint">reset view</button>
      <button id="theme" title="light / dark — follows your system by default">theme</button>
    </div>
  </footer>
</div>
<script>
const DATA = /*__DATA__*/null;

/* The canvas can't read CSS variables per-pixel, so the scene keeps its own
   palette and swaps it whenever the theme changes. */
const PALETTE = {
  dark: { bg:"#0d0f13", dot:"#e6e9ef", trail:"#ffffff", bounds:"rgba(255,255,255,0.07)",
          gridNear:"#2f3540", gridFar:"#1c2029", horizon:"rgba(150,180,220,0.40)",
          line:[140,175,215], sky:["#0b1220","#16223a","#2b3a52"],
          ground:["#2c3a52","#1e2839","#131a28"], sun:[255,236,190], shadow:0.34 },
  light:{ bg:"#eef1f6", dot:"#2a3040", trail:"#333a48", bounds:"rgba(0,0,0,0.08)",
          gridNear:"#b9c2d0", gridFar:"#d5dbe4", horizon:"rgba(70,100,140,0.45)",
          line:[80,110,150], sky:["#bcd4ef","#d7e6f7","#eaf1fa"],
          ground:["#c3ccd8","#d3dae4","#e4e9f0"], sun:[255,246,214], shadow:0.22 },
};
let TH = PALETTE.dark;

const GROUP_COLOR = {
  torso:"#c8cdd6", left_arm:"#4a9eff", right_arm:"#ff7a59",
  left_leg:"#41c7a8", right_leg:"#f2c14e", face:"#6b7280",
};
const EDGES = [];
for (const [g, list] of Object.entries(DATA.edges))
  for (const [a,b] of list) EDGES.push([a,b,GROUP_COLOR[g]]);

const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
const F = DATA.frames, N = F.length, FPS = DATA.fps;
const SCREEN = DATA.screen || null;
// True presentation time of each frame. Phone clips drop frames, so index/fps
// lies; every seek and every video->frame lookup goes through this instead.
const TIMES = DATA.times || Array.from({length:DATA.frames.length},(_,i)=>i/DATA.fps);
function frameAtTime(t){
  let lo=0, hi=TIMES.length-1;
  if(t<=TIMES[0]) return 0;
  if(t>=TIMES[hi]) return hi;
  while(lo<hi-1){ const mid=(lo+hi)>>1; if(TIMES[mid]<=t) lo=mid; else hi=mid; }
  return (t-TIMES[lo] <= TIMES[hi]-t) ? lo : hi;
}
const VIDSRC = DATA.video && DATA.video.src;

const SCENE = DATA.scene || null;          // athlete placed in the real camera's frame
const INTR  = DATA.intrinsics || null;
const canFixed = !!(SCENE && INTR);

// ---- camera -------------------------------------------------------------
// Default = the source camera's own viewpoint: looking straight down world -z,
// so the 3D pane opens as a 3D rebuild of exactly what the video shows. Orbit
// away freely; "reset view" comes back here.
const HOME = { yaw:0, pitch:0, dist:2.2, panx:0, pany:0.1 };
let cam = {...HOME};
// "fixed" stands the camera exactly where the phone was and never moves it;
// "follow" is the orbitable rig that keeps the athlete centred.
let mode = canFixed ? "fixed" : "follow";

/* The real camera is where this view STARTS, not where it is stuck.

   Everything below happens in a WORLD frame whose Y axis is the ground normal
   and whose origin sits on the ground directly under the athlete. Orbiting
   spins about that world up-axis, so the ground stays level however far you
   swing around -- rotating about the camera's own axes instead is what made
   the ground look tilted. At yaw=pitch=0, zoom=1 the round trip is the
   identity, so the opening view is still bit-for-bit the real camera. */
let view = { yaw:0, pitch:0, zoom:1 };
const VIEW_HOME = { yaw:0, pitch:0, zoom:1 };

// The fitted ground plane, in camera coordinates: n.p + d = 0, n pointing up.
const FN = (DATA.floor && DATA.floor.n) || [0,1,0];
const FD = (DATA.floor && DATA.floor.d) || 1.4;
function heightAbove(p){ return FN[0]*p[0] + FN[1]*p[1] + FN[2]*p[2] + FD; }

// Middle of the hip's x/y/z range over the clip: what we orbit around.
let PIVOT = [0,0,3];
if (canFixed){
  let lo=[ Infinity, Infinity, Infinity], hi=[-Infinity,-Infinity,-Infinity];
  for (const f of SCENE){
    if(!f || !f[23] || f[23][0]===null) continue;
    for(let k=0;k<3;k++){
      const c=(f[23][k]+f[24][k])/2;
      lo[k]=Math.min(lo[k],c); hi[k]=Math.max(hi[k],c);
    }
  }
  if (isFinite(lo[0])) PIVOT = [0,1,2].map(k=>(lo[k]+hi[k])/2);
}

// World axes expressed in camera coordinates. Y is the ground normal; X is the
// camera's right, flattened into the ground; Z completes a right-handed frame.
const WY = norm3(FN);
const WX = (()=>{ const r=[1,0,0], k=dot3(r,WY);
                  return norm3([r[0]-k*WY[0], r[1]-k*WY[1], r[2]-k*WY[2]]); })();
const WZ = cross3(WX, WY);
// Origin: the athlete's pivot dropped straight onto the ground. This is what
// puts the grid under the skeleton instead of under the lens.
const WO = (()=>{ const hgt = heightAbove(PIVOT);
                  return [PIVOT[0]-hgt*WY[0], PIVOT[1]-hgt*WY[1], PIVOT[2]-hgt*WY[2]]; })();

function toWorld(p){
  const v=[p[0]-WO[0], p[1]-WO[1], p[2]-WO[2]];
  return [dot3(v,WX), dot3(v,WY), dot3(v,WZ)];
}
function toCamera(pw){
  return [WO[0] + pw[0]*WX[0] + pw[1]*WY[0] + pw[2]*WZ[0],
          WO[1] + pw[0]*WX[1] + pw[1]*WY[1] + pw[2]*WZ[1],
          WO[2] + pw[0]*WX[2] + pw[1]*WY[2] + pw[2]*WZ[2]];
}
// Orbit: yaw about world up, then pitch about world X. Applied in world space,
// which is why the horizon stays horizontal.
function rotView(v){
  const cy=Math.cos(view.yaw), sy=Math.sin(view.yaw);
  const cp=Math.cos(view.pitch), sp=Math.sin(view.pitch);
  const x = v[0]*cy - v[2]*sy;
  let z   = v[0]*sy + v[2]*cy;
  const y = v[1]*cp - z*sp;
  z       = v[1]*sp + z*cp;
  return [x,y,z];
}
function viewPoint(p){ return toCamera(rotView(toWorld(p))); }
// A point given directly in world coordinates (the grid, shadows).
function worldPoint(pw){ return toCamera(rotView(pw)); }

// Maps the real camera's image plane onto the canvas, letterboxed, so the
// fixed view frames the scene exactly as the video does.
let FIT = {s:1, ox:0, oy:0};
function fitCanvas(w,h){
  const sc = Math.min(w/INTR.width, h/INTR.height);
  FIT = { s:sc, ox:(w-INTR.width*sc)/2, oy:(h-INTR.height*sc)/2 };
  return FIT;
}
// Pinhole projection with the recovered intrinsics: camera at the origin
// looking down +z, y up.
function pinhole(q){
  const z = q[2];
  if (z <= 0.05) return null;
  return [INTR.cx + INTR.fx*q[0]/z, INTR.cy - INTR.fy*q[1]/z, z];
}
function toCanvas(im){
  const pc = pinhole(PIVOT);
  let u = im[0], v = im[1];
  // magnify about the pivot's image position so zoom never walks off the athlete
  if (pc){ u = pc[0] + (u-pc[0])*view.zoom; v = pc[1] + (v-pc[1])*view.zoom; }
  return [FIT.ox + u*FIT.s, FIT.oy + v*FIT.s, im[2]];
}
function projectFixed(p, w, h){
  const im = pinhole(viewPoint(p));
  return im ? toCanvas(im) : null;
}
function projectWorld(pw, w, h){
  const im = pinhole(worldPoint(pw));
  return im ? toCanvas(im) : null;
}

/* Pixels per metre at a given camera depth. Radii and thicknesses must go
   through this or they stop being 3D -- that is what made the joints clump
   into a blob of same-sized dots when zoomed out. */
function dirToCam(v){
  if (mode !== "fixed") return toCam(v);
  const r = rotView(v);
  return [r[0]*WX[0]+r[1]*WY[0]+r[2]*WZ[0],
          r[0]*WX[1]+r[1]*WY[1]+r[2]*WZ[1],
          r[0]*WX[2]+r[1]*WY[2]+r[2]*WZ[2]];
}
function pxPerMetre(z, w, h){
  if (mode === "fixed") return INTR.fx * FIT.s * view.zoom / Math.max(z, 1e-3);
  return (h * 0.62) / Math.max(z, 1e-3);
}

let SFLOOR = -FD;                                     // kept for the follow-cam blob

// Light in world space, up/front/camera-left, plus a dim fill from the opposite
// side so limbs facing away never go fully black.
const LIGHT = norm3([-0.45, 0.8, 0.42]);
const FILL  = norm3([0.55, 0.15, -0.4]);

function norm3(v){ const l=Math.hypot(v[0],v[1],v[2])||1; return [v[0]/l,v[1]/l,v[2]/l]; }
function sub3(a,b){ return [a[0]-b[0],a[1]-b[1],a[2]-b[2]]; }
function dot3(a,b){ return a[0]*b[0]+a[1]*b[1]+a[2]*b[2]; }
function cross3(a,b){ return [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]]; }

function shade(rgb, amt){
  if (TH === PALETTE.light) amt = 0.16 + amt*0.84;   // keep limbs off pure black
  // amt in [0,1]; below .5 darkens toward black, above brightens toward white
  const t = Math.max(0, Math.min(1, amt));
  return rgb.map(c => t < 0.5 ? c * (0.35 + 1.3*t)
                              : c + (255-c) * (t-0.5) * 0.9);
}
function css(rgb, a){ return `rgba(${rgb.map(c=>Math.round(Math.max(0,Math.min(255,c)))).join(",")},${a})`; }
function hex2rgb(h){ return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)]; }

function project(p, w, h) {
  if (mode === "fixed") return projectFixed(p, w, h);
  // yaw about world Y, then pitch, then a simple perspective divide.
  const cy=Math.cos(cam.yaw), sy=Math.sin(cam.yaw);
  const cp=Math.cos(cam.pitch), sp=Math.sin(cam.pitch);
  let x = p[0]*cy - p[2]*sy;
  let z = p[0]*sy + p[2]*cy;
  let y = p[1]*cp - z*sp;
  z     = p[1]*sp + z*cp;
  const zc = z + cam.dist;
  if (zc <= 0.05) return null;
  const s = (h * 0.62) / zc;
  return [w/2 + (x + cam.panx)*s, h/2 - (y + cam.pany)*s, zc];
}

// ---- data helpers -------------------------------------------------------
// One switch for the whole renderer: which point cloud, and where the ground is.
function PT(i){ return (mode==="fixed" ? SCENE : F)[i]; }
function floorY(){ return mode==="fixed" ? SFLOOR : FLOOR; }
function frameOK(i){
  const f=PT(i);
  return DATA.detected[i] && f && f[0] && f[0][0]!==null;
}
function hipCentre(i){
  const f=PT(i); if(!f||!f[23]||!f[24]||f[23][0]===null) return null;
  return [(f[23][0]+f[24][0])/2,(f[23][1]+f[24][1])/2,(f[23][2]+f[24][2])/2];
}
// floor height = lowest foot point across the clip, so the grid sits under the athlete
let FLOOR = 0;
{ let lo=Infinity;
  for(let i=0;i<N;i++) if(frameOK(i)) for(const j of [29,30,31,32]) lo=Math.min(lo,F[i][j][1]);
  FLOOR = isFinite(lo) ? lo : -1; }

// ---- 3D drawing ---------------------------------------------------------
function drawGrid(w,h){
  const R=1.2, step=0.3;
  ctx.lineWidth=1;
  for(let k=-R;k<=R+1e-6;k+=step){
    for(const seg of [[[-R,FLOOR,k],[R,FLOOR,k]],[[k,FLOOR,-R],[k,FLOOR,R]]]){
      const a=project(seg[0],w,h), b=project(seg[1],w,h);
      if(!a||!b) continue;
      ctx.strokeStyle = Math.abs(k)<1e-6 ? TH.gridNear : TH.gridFar;
      ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.stroke();
    }
  }
}

// Limb thickness in metres, roughly anatomical so the figure reads as a body.
const LIMB_R = { torso:0.075, left_arm:0.045, right_arm:0.045,
                 left_leg:0.062, right_leg:0.062, face:0.022 };
const BONE_R = {};   // "a-b" -> radius
for (const [g, list] of Object.entries(DATA.edges))
  for (const [a,b] of list) BONE_R[a+"-"+b] = LIMB_R[g];
// hands and feet taper down from the limb they hang off
for (const k of ["15-17","15-19","15-21","17-19","16-18","16-20","16-22","18-20"]) BONE_R[k]=0.028;
for (const k of ["27-29","27-31","29-31","28-30","28-32","30-32"]) BONE_R[k]=0.035;

const JOINT_R = {};  // sphere radius per landmark = thickest bone touching it
for (const [a,b,,key] of EDGES.map(e=>[e[0],e[1],e[2],e[0]+"-"+e[1]])) {
  JOINT_R[a]=Math.max(JOINT_R[a]||0, BONE_R[key]*0.92);
  JOINT_R[b]=Math.max(JOINT_R[b]||0, BONE_R[key]*0.92);
}

// Rotate a world point into camera space (same transform as project(), minus
// the perspective divide) so we can do lighting and depth sorting there.
function toCam(p){
  if (mode === "fixed") return viewPoint(p);         // camera space after orbiting
  const cy=Math.cos(cam.yaw), sy=Math.sin(cam.yaw);
  const cp=Math.cos(cam.pitch), sp=Math.sin(cam.pitch);
  const x = p[0]*cy - p[2]*sy;
  let z = p[0]*sy + p[2]*cy;
  const y = p[1]*cp - z*sp;
  z = p[1]*sp + z*cp;
  return [x, y, z];
}

/* A capsule: draw it as a screen-space quad between two circles, filled with a
   gradient across the bone's perpendicular. The gradient stands in for the
   cylinder's surface normal sweeping from -90deg to +90deg, which is what makes
   the limb read as round rather than as a flat stroke. */
function capsule(pa, pb, rw, rgb, alpha, w, h){
  const A=project(pa,w,h), B=project(pb,w,h);
  if(!A||!B) return;
  const sA=pxPerMetre(A[2],w,h), sB=pxPerMetre(B[2],w,h);   // world->px at each end
  const ra=rw*sA, rb=rw*sB;
  let dx=B[0]-A[0], dy=B[1]-A[1];
  const len=Math.hypot(dx,dy) || 1e-6;
  dx/=len; dy/=len;
  const px=-dy, py=dx;                         // screen-space perpendicular

  // where the lit side falls, in perpendicular screen units
  const axis = norm3(sub3(toCam(pb), toCam(pa)));
  const Lc = dirToCam(LIGHT);
  // component of the light perpendicular to the bone axis, projected on screen
  const lp = norm3(sub3(Lc, axis.map(c=>c*dot3(Lc,axis))));
  const t = Math.max(-1, Math.min(1, lp[0]*px - lp[1]*py));
  const depthLit = Math.max(0, -lp[2]);        // light coming toward the camera

  const mx=(A[0]+B[0])/2, my=(A[1]+B[1])/2, rm=(ra+rb)/2;
  const g=ctx.createLinearGradient(mx-px*rm, my-py*rm, mx+px*rm, my+py*rm);
  const base = 0.5 + 0.42*t + 0.18*depthLit;
  g.addColorStop(0,    css(shade(rgb, base-0.42), alpha));
  g.addColorStop(0.45, css(shade(rgb, base+0.06), alpha));
  g.addColorStop(0.62, css(shade(rgb, base+0.20), alpha));   // specular band
  g.addColorStop(1,    css(shade(rgb, base-0.34), alpha));
  ctx.fillStyle=g;

  ctx.beginPath();
  ctx.arc(A[0],A[1],ra, Math.atan2(py,px), Math.atan2(py,px)+Math.PI, true);
  ctx.arc(B[0],B[1],rb, Math.atan2(py,px)+Math.PI, Math.atan2(py,px), true);
  ctx.closePath();
  ctx.fill();
}

/* A joint sphere: radial gradient with the highlight pushed toward the light. */
function sphere(p, rw, rgb, alpha, w, h){
  const S=project(p,w,h); if(!S) return;
  const r=rw*pxPerMetre(S[2],w,h);
  if(r<0.4) return;
  const Lc=norm3(dirToCam(LIGHT));
  const hx=S[0]+Lc[0]*r*0.45, hy=S[1]-Lc[1]*r*0.45;
  const g=ctx.createRadialGradient(hx,hy,r*0.08, S[0],S[1],r);
  const lit=0.5+0.3*Math.max(0,-Lc[2]);
  g.addColorStop(0,   css(shade(rgb, lit+0.30), alpha));
  g.addColorStop(0.6, css(shade(rgb, lit-0.02), alpha));
  g.addColorStop(1,   css(shade(rgb, lit-0.36), alpha));
  ctx.fillStyle=g;
  ctx.beginPath(); ctx.arc(S[0],S[1],r,0,7); ctx.fill();
}

/* Filled torso quad, shaded by its own surface normal — without this the trunk
   is a wire box and the figure never reads as solid. */
function torsoSlab(f, alpha, w, h){
  const idx=[11,12,24,23];
  if(idx.some(j=>!f[j]||f[j][0]===null)) return;
  const P=idx.map(j=>project(f[j],w,h));
  if(P.some(p=>!p)) return;
  const C=idx.map(j=>toCam(f[j]));
  let n=norm3(cross3(sub3(C[1],C[0]), sub3(C[3],C[0])));
  if(n[2]>0) n=n.map(c=>-c);                   // always face the camera
  const Lc=norm3(dirToCam(LIGHT)), Fc=norm3(dirToCam(FILL));
  const lit = 0.42 + 0.46*Math.max(0,dot3(n,Lc)) + 0.16*Math.max(0,dot3(n,Fc));
  ctx.fillStyle=css(shade(hex2rgb(GROUP_COLOR.torso), lit), alpha*0.95);
  ctx.beginPath(); ctx.moveTo(P[0][0],P[0][1]);
  for(let k=1;k<4;k++) ctx.lineTo(P[k][0],P[k][1]);
  ctx.closePath(); ctx.fill();
}

/* Contact shadow: the figure flattened onto the floor plane, so you can read
   height off the ground instead of guessing. */
function groundShadow(f, w, h){
  ctx.save(); ctx.globalCompositeOperation="multiply";
  for(let j=11;j<33;j++){
    const p=f[j]; if(!p||p[0]===null) continue;
    const S=project([p[0],floorY()+0.005,p[2]],w,h); if(!S) continue;
    const drop=Math.max(0, p[1]-floorY());
    const r=(JOINT_R[j]||0.04)*3.2*pxPerMetre(S[2],w,h) * (1+drop*0.8);
    const a=0.30/(1+drop*2.2);
    const g=ctx.createRadialGradient(S[0],S[1],0,S[0],S[1],r);
    g.addColorStop(0,`rgba(0,0,0,${a})`); g.addColorStop(1,"rgba(0,0,0,0)");
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(S[0],S[1],r,0,7); ctx.fill();
  }
  ctx.restore();
}


/* ---- the fixed camera's world: sky, horizon, ground plane ----------------
   The floor is the plane y = SFLOOR. Its vanishing line -- the horizon -- is
   where points on that plane land as z goes to infinity, which for a camera
   looking straight down +z is exactly the principal point's row. */
/* The horizon is the plane's vanishing line: directions with n.dir = 0. In
   image terms that is a straight line, slanted whenever the camera is rolled. */
function horizonAt(px){
  // ground normal (0,1,0) in world space, carried through the orbit into camera space
  const r = rotView([0,1,0]);
  const n = [r[0]*WX[0]+r[1]*WY[0]+r[2]*WZ[0],
             r[0]*WX[1]+r[1]*WY[1]+r[2]*WZ[1],
             r[0]*WX[2]+r[1]*WY[2]+r[2]*WZ[2]];
  if (Math.abs(n[1]) < 1e-4) return null;
  const pc = pinhole(PIVOT);
  let u = (px - FIT.ox)/FIT.s;
  if (pc) u = pc[0] + (u - pc[0])/view.zoom;   // undo the zoom to ask the pinhole
  // a vanishing line depends only on the plane's direction, not its offset
  let v = INTR.cy + INTR.fy * ( n[0]*(u-INTR.cx)/INTR.fx + n[2] ) / n[1];
  if (pc) v = pc[1] + (v - pc[1])*view.zoom;
  return FIT.oy + v*FIT.s;
}
function horizonY(){ const h=horizonAt(FIT.ox + INTR.cx*FIT.s); return h===null?-1e5:h; }

function drawSky(w,h){
  const hL=horizonAt(0), hR=horizonAt(w);
  const hz=Math.max(hL,hR);
  const g=ctx.createLinearGradient(0,0,0,Math.max(hz,1));
  g.addColorStop(0,TH.sky[0]); g.addColorStop(0.75,TH.sky[1]); g.addColorStop(1,TH.sky[2]);
  ctx.fillStyle=g;
  ctx.beginPath(); ctx.moveTo(0,-1); ctx.lineTo(w,-1);
  ctx.lineTo(w,hR); ctx.lineTo(0,hL); ctx.closePath(); ctx.fill();

  // the key light, drawn where it actually sits if it is in view
  const far=60;
  const S=projectWorld([LIGHT[0]*far, LIGHT[1]*far, LIGHT[2]*far], w, h);
  if(S && S[0]>-200 && S[0]<w+200 && S[1]<hz){
    const gs=ctx.createRadialGradient(S[0],S[1],0,S[0],S[1],Math.max(w,h)*0.22);
    const S3=TH.sun.join(",");
    gs.addColorStop(0,`rgba(${S3},0.55)`);
    gs.addColorStop(0.25,`rgba(${S3},0.14)`);
    gs.addColorStop(1,`rgba(${S3},0)`);
    ctx.fillStyle=gs; ctx.beginPath();
    ctx.arc(S[0],S[1],Math.max(w,h)*0.22,0,7); ctx.fill();
  }
}

function drawFloor(w,h){
  const hL=horizonAt(0), hR=horizonAt(w), hz=Math.min(hL,hR);
  const g=ctx.createLinearGradient(0,Math.max(hz,0),0,h);
  g.addColorStop(0,TH.ground[0]); g.addColorStop(0.25,TH.ground[1]); g.addColorStop(1,TH.ground[2]);
  ctx.fillStyle=g;
  ctx.beginPath(); ctx.moveTo(0,hL); ctx.lineTo(w,hR);
  ctx.lineTo(w,h+1); ctx.lineTo(0,h+1); ctx.closePath(); ctx.fill();

  ctx.strokeStyle=TH.horizon; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(0,hL); ctx.lineTo(w,hR); ctx.stroke();

  // one-metre grid drawn in the plane's own coordinates
  const R=14, FAR=26;
  ctx.lineWidth=1;
  const seg=(pa,pb,style)=>{
    const A=projectWorld(pa,w,h), B=projectWorld(pb,w,h);
    if(!A||!B) return;
    ctx.strokeStyle=style(A,B);
    ctx.beginPath(); ctx.moveTo(A[0],A[1]); ctx.lineTo(B[0],B[1]); ctx.stroke();
  };
  for(let a=-R;a<=R;a++)
    seg([a,0,-FAR], [a,0,FAR], (A,B)=>{
      const lg=ctx.createLinearGradient(A[0],A[1],B[0],B[1]);
      const al = a===0 ? 0.55 : 0.26;
      const L=TH.line.join(",");
      lg.addColorStop(0,`rgba(${L},${al})`); lg.addColorStop(1,`rgba(${L},0)`);
      return lg;
    });
  for(let b=-FAR;b<=FAR;b++)
    seg([-R,0,b], [R,0,b],
        ()=>`rgba(${TH.line.join(",")},${0.30*Math.max(0,1-Math.abs(b)/FAR)})`);
}

/* Real cast shadow: slide each joint along the light direction until it hits
   the floor plane. Drawn into an offscreen buffer at full opacity and then
   composited once, so overlapping limbs never stack into darker patches --
   a shadow is one tint no matter how much of the body is above it. */
const shadowBuf = document.createElement("canvas");
const sctx = shadowBuf.getContext("2d");

function castShadow(f,w,h){
  const L=[-LIGHT[0],-LIGHT[1],-LIGHT[2]];   // LIGHT points at the light; rays go the other way
  if(L[1] > -0.05) return;                   // light not above the ground
  const dpr=window.devicePixelRatio||1;
  if(shadowBuf.width!==w*dpr||shadowBuf.height!==h*dpr){
    shadowBuf.width=w*dpr; shadowBuf.height=h*dpr;
  }
  sctx.setTransform(dpr,0,0,dpr,0,0);
  sctx.clearRect(0,0,w,h);
  const put=[];
  for(let j=0;j<33;j++){
    const p=f[j];
    if(!p||p[0]===null){ put.push(null); continue; }
    const pw=toWorld(p);
    const t=-pw[1]/L[1];                     // slide along the ray onto y=0
    put.push([pw[0]+L[0]*t, 0, pw[2]+L[2]*t]);
  }
  sctx.strokeStyle="#000"; sctx.lineCap="round";
  for(const [a,b] of EDGES){
    if(!put[a]||!put[b]) continue;
    const A=projectWorld(put[a],w,h), B=projectWorld(put[b],w,h);
    if(!A||!B) continue;
    sctx.lineWidth=Math.max(1, 0.055*pxPerMetre(A[2],w,h));
    sctx.beginPath(); sctx.moveTo(A[0],A[1]); sctx.lineTo(B[0],B[1]); sctx.stroke();
  }
  // one composite, one tint -- height off the ground only softens the whole thing
  const hip=hipCentre(cur);
  const drop=hip ? Math.max(0, heightAbove(hip)) : 0;
  ctx.save();
  ctx.globalCompositeOperation="multiply";
  ctx.globalAlpha=TH.shadow/(1+drop*0.9);
  ctx.drawImage(shadowBuf, 0, 0, w, h);
  ctx.restore();
}

/* Faint outline of what the real camera actually saw, since the canvas is a
   different shape than the video. */
function drawFrameBounds(w,h){
  ctx.strokeStyle=TH.bounds; ctx.lineWidth=1;
  ctx.strokeRect(FIT.ox, FIT.oy, INTR.width*FIT.s, INTR.height*FIT.s);
}

function drawSkeleton(i,w,h,alpha){
  const f=PT(i); if(!f) return;

  if(!solid || alpha<1){                        // flat wireframe fallback + ghosts
    const P=f.map(p => (p && p[0]!==null) ? project(p,w,h) : null);
    ctx.lineCap="round";
    for(const [a,b,col] of EDGES){
      if(!P[a]||!P[b]) continue;
      const vis=Math.min(DATA.visibility[i][a],DATA.visibility[i][b]);
      ctx.strokeStyle=col; ctx.globalAlpha=alpha*(0.25+0.75*vis);
      ctx.lineWidth=alpha===1?4:2;
      ctx.beginPath(); ctx.moveTo(P[a][0],P[a][1]); ctx.lineTo(P[b][0],P[b][1]); ctx.stroke();
    }
    ctx.globalAlpha=1;
    return;
  }

  if(alpha===1){ if(mode==="fixed") castShadow(f,w,h); else groundShadow(f,w,h); }

  // Painter's algorithm: no depth buffer on a 2D canvas, so collect every
  // primitive with its camera depth and paint far-to-near.
  const prims=[];
  for(const [a,b,col] of EDGES){
    if(!f[a]||f[a][0]===null||!f[b]||f[b][0]===null) continue;
    const vis=Math.min(DATA.visibility[i][a],DATA.visibility[i][b]);
    if(vis<0.15) continue;
    const depth=(toCam(f[a])[2]+toCam(f[b])[2])/2;
    const rgb=hex2rgb(col), r=BONE_R[a+"-"+b]||0.04;
    const dim=rgb.map(c=>c*(0.55+0.45*vis));      // uncertain limbs darken, not fade
    prims.push({depth, draw:()=>capsule(f[a],f[b],r,dim,alpha,w,h)});
  }
  for(let j=0;j<33;j++){
    if(!f[j]||f[j][0]===null||!JOINT_R[j]) continue;
    if(DATA.visibility[i][j]<0.15) continue;
    const grp=EDGES.find(e=>e[0]===j||e[1]===j);
    const jv=DATA.visibility[i][j];
    const jrgb=hex2rgb(grp?grp[2]:"#c8cdd6").map(c=>c*(0.55+0.45*jv));
    prims.push({depth:toCam(f[j])[2],
                draw:()=>sphere(f[j], JOINT_R[j], jrgb, alpha, w, h)});
  }
  const tC=[11,12,23,24].every(j=>f[j]&&f[j][0]!==null)
    ? [11,12,23,24].reduce((s,j)=>s+toCam(f[j])[2],0)/4 : null;
  if(tC!==null) prims.push({depth:tC+0.02, draw:()=>torsoSlab(f,alpha,w,h)});

  prims.sort((p,q)=>q.depth-p.depth);
  for(const p of prims) p.draw();
  ctx.globalAlpha=1;
}

const TRAIL_LEN = 45;
function drawTrail(w,h,upto){
  const sel=document.getElementById("trailsel").value;
  if(sel==="") return;
  ctx.strokeStyle=TH.trail; ctx.lineWidth=1.5; ctx.globalAlpha=0.55;
  ctx.beginPath(); let started=false;
  // only the recent past: over a whole clip, monocular depth noise turns the
  // path into scribble long before it tells you anything
  const from = Math.max(0, upto - TRAIL_LEN);
  for(let i=from;i<=upto;i++){
    if(!frameOK(i)){ started=false; continue; }
    const p = sel==="com" ? hipCentre(i) : PT(i)[+sel];
    if(!p||p[0]===null){ started=false; continue; }
    const q=project(p,w,h); if(!q){ started=false; continue; }
    if(started) ctx.lineTo(q[0],q[1]); else { ctx.moveTo(q[0],q[1]); started=true; }
  }
  ctx.stroke(); ctx.globalAlpha=1;
}

// ---- 2D overlay on the video -------------------------------------------
const vid = document.getElementById("vid");
const ovl = document.getElementById("ovl"), octx = ovl.getContext("2d");
const videoPane = document.getElementById("videoPane");
let showOverlay = true, hasVideo = false;

if (VIDSRC) {
  hasVideo = true;
  vid.src = VIDSRC;
  videoPane.classList.add("on");
  vid.addEventListener("loadedmetadata", () => {
    // size the box to the video's aspect so the overlay lines up exactly
    document.getElementById("vidbox").style.aspectRatio =
      `${vid.videoWidth} / ${vid.videoHeight}`;
  });
  vid.addEventListener("error", () => {
    videoPane.classList.remove("on");
    document.getElementById("overlay").disabled = true;
    console.warn("video failed to load:", VIDSRC);
  });
} else {
  document.getElementById("overlay").style.display = "none";
}

function drawOverlay(i){
  const dpr=window.devicePixelRatio||1;
  const w=ovl.clientWidth, h=ovl.clientHeight;
  if(!w||!h) return;
  if(ovl.width!==w*dpr||ovl.height!==h*dpr){ ovl.width=w*dpr; ovl.height=h*dpr; }
  octx.setTransform(dpr,0,0,dpr,0,0);
  octx.clearRect(0,0,w,h);
  if(!showOverlay || !SCREEN || !SCREEN[i]) return;

  // landmarks are normalised to the source frame, and the <video> fills the
  // box at its native aspect ratio, so a straight multiply is correct.
  const P = SCREEN[i].map(p => (p && p[0]!==null) ? [p[0]*w, p[1]*h] : null);
  octx.lineCap="round";
  for(const [a,b,col] of EDGES){
    if(!P[a]||!P[b]) continue;
    const vis=Math.min(DATA.visibility[i][a],DATA.visibility[i][b]);
    if(vis<0.3) continue;
    octx.strokeStyle=col; octx.globalAlpha=0.35+0.65*vis;
    octx.lineWidth=Math.max(2, w/220);
    octx.beginPath(); octx.moveTo(P[a][0],P[a][1]); octx.lineTo(P[b][0],P[b][1]); octx.stroke();
  }
  octx.globalAlpha=1; octx.fillStyle="#fff";
  const r=Math.max(2, w/380);
  for(let j=11;j<P.length;j++){ if(!P[j]||DATA.visibility[i][j]<0.3) continue;
    octx.beginPath(); octx.arc(P[j][0],P[j][1],r,0,7); octx.fill(); }
}

// ---- render loop --------------------------------------------------------
let showGhosts=false, showGrid=true, solid=true, cur=0;

function render3D(){
  const dpr=window.devicePixelRatio||1;
  const w=cv.clientWidth, h=cv.clientHeight;
  if(cv.width!==w*dpr||cv.height!==h*dpr){ cv.width=w*dpr; cv.height=h*dpr; }
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,w,h);
  ctx.fillStyle=TH.bg; ctx.fillRect(0,0,w,h);

  if(mode==="fixed"){
    fitCanvas(w,h);
    if(showGrid){ drawSky(w,h); drawFloor(w,h); drawFrameBounds(w,h); }
  } else if(showGrid) drawGrid(w,h);
  if(showGhosts) for(const d of [-8,-4,4,8]){
    const i=cur+d; if(i>=0&&i<N&&frameOK(i)) drawSkeleton(i,w,h,0.16);
  }
  drawTrail(w,h,cur);
  if(frameOK(cur)) drawSkeleton(cur,w,h,1);

  document.getElementById("nodet").style.display = frameOK(cur)?"none":"block";
  const hp=hipCentre(cur);
  document.getElementById("hud").innerHTML =
    `frame <b>${cur}</b> &nbsp; t=<b>${TIMES[cur].toFixed(2)}s</b>` +
    (hp ? (mode==="fixed"
            ? `<br>hip ~<b>${heightAbove(hp).toFixed(2)}</b> m up · ~<b>${hp[2].toFixed(1)}</b> m out`
            : `<br>hip height <b>${(hp[1]-floorY()).toFixed(2)}</b> m`)
        : "");
}

// ---- playback -----------------------------------------------------------
// With a video loaded the <video> element is the clock and `cur` follows it;
// otherwise we advance frames off requestAnimationFrame.
const scrub=document.getElementById("scrub"), playBtn=document.getElementById("play");
scrub.max=N-1;
document.getElementById("fcount").textContent =
  `${N} frames · ${FPS.toFixed(1)} fps` + (DATA.model?` · ${DATA.model}`:"");

let playing=false, acc=0, last=0;

function setFrame(i){
  cur=Math.max(0,Math.min(N-1,i));
  scrub.value=cur;
  if(hasVideo && !playing) vid.currentTime = TIMES[cur];
}

function loop(t){
  if(playing){
    if(hasVideo && vid.readyState>=2){
      cur = frameAtTime(vid.currentTime);
      scrub.value=cur;
    } else {
      if(!last) last=t;
      acc += (t-last)/1000 * FPS * parseFloat(document.getElementById("speed").value);
      last=t;
      while(acc>=1){ cur=(cur+1)%N; acc-=1; scrub.value=cur; }
    }
  } else last=0;
  render3D();
  drawOverlay(cur);
  requestAnimationFrame(loop);
}

function setPlaying(v){
  playing=v; last=0;
  playBtn.textContent = v?"❚❚ pause":"▶ play";
  playBtn.classList.toggle("on",v);
  if(hasVideo){
    if(v){ if(vid.ended || cur>=N-1) vid.currentTime=0; vid.play().catch(()=>{}); }
    else vid.pause();
  }
}
if(hasVideo) vid.addEventListener("ended", ()=>setPlaying(false));

playBtn.onclick=()=>setPlaying(!playing);
scrub.oninput=()=>setFrame(+scrub.value);
document.getElementById("speed").onchange=e=>{ if(hasVideo) vid.playbackRate=parseFloat(e.target.value); };
document.getElementById("solid").onclick=e=>{ solid=!solid; e.target.classList.toggle("on",solid); };
document.getElementById("ghost").onclick=e=>{ showGhosts=!showGhosts; e.target.classList.toggle("on",showGhosts); };
document.getElementById("grid").onclick=e=>{ showGrid=!showGrid; e.target.classList.toggle("on",showGrid); };
document.getElementById("overlay").onclick=e=>{ showOverlay=!showOverlay; e.target.classList.toggle("on",showOverlay); };
const modeSel=document.getElementById("cammode");
modeSel.value = mode;
if(!canFixed){
  modeSel.querySelector('option[value=fixed]').disabled = true;
  modeSel.title = "no scene placement in this file — re-run extract_pose.py";
}
function applyMode(){
  mode = modeSel.value;
  cv.style.cursor = "grab";
  document.getElementById("panetag").textContent =
    mode==="fixed" ? "3D scene — fixed camera" : "3D pose — follow camera";
  document.getElementById("reset").disabled = false;
  document.getElementById("camhint").textContent = (mode==="fixed")
    ? "starts at the real camera · drag to orbit the scene · scroll to zoom"
    : "drag to orbit · scroll to zoom · shift-drag to pan";
}
modeSel.onchange=applyMode;
document.getElementById("reset").onclick=()=>{
  if(mode==="fixed") view={...VIEW_HOME};       // back to the real camera
  else cam={...HOME};
};
addEventListener("keydown",e=>{
  if(e.target.tagName==="SELECT"||e.target.tagName==="INPUT") return;
  if(e.code==="Space"){ e.preventDefault(); setPlaying(!playing); }
  if(e.code==="ArrowRight"){ setPlaying(false); setFrame(cur+1); }
  if(e.code==="ArrowLeft"){ setPlaying(false); setFrame(cur-1); }
});

// ---- mouse --------------------------------------------------------------
let drag=null;
cv.addEventListener("pointerdown",e=>{
  drag={x:e.clientX,y:e.clientY,shift:e.shiftKey}; cv.setPointerCapture(e.pointerId); });
cv.addEventListener("pointermove",e=>{
  if(!drag) return;
  const dx=e.clientX-drag.x, dy=e.clientY-drag.y;
  if(mode==="fixed"){
    view.yaw += dx*0.008;
    view.pitch = Math.max(-1.2, Math.min(1.2, view.pitch + dy*0.008));
  } else if(drag.shift){
    cam.panx+=dx*0.004*cam.dist; cam.pany-=dy*0.004*cam.dist;
  } else {
    cam.yaw+=dx*0.008; cam.pitch=Math.max(-1.4,Math.min(1.4,cam.pitch+dy*0.008));
  }
  drag.x=e.clientX; drag.y=e.clientY;
});
cv.addEventListener("pointerup",()=>drag=null);
cv.addEventListener("wheel",e=>{ e.preventDefault();
  if(mode==="fixed"){
    view.zoom = Math.max(0.25, Math.min(8, view.zoom*Math.exp(-e.deltaY*0.001)));
  } else {
    cam.dist=Math.max(0.6,Math.min(12,cam.dist*Math.exp(e.deltaY*0.001)));
  }},{passive:false});

// ---- theme --------------------------------------------------------------
// System preference decides the default; the button overrides it, and if the
// user never overrides we keep following the system live.
const mql = window.matchMedia("(prefers-color-scheme: light)");
let themeOverride = null;
function currentTheme(){ return themeOverride || (mql.matches ? "light" : "dark"); }
function applyTheme(){
  const t = currentTheme();
  document.documentElement.setAttribute("data-theme", t);
  TH = PALETTE[t];
  document.getElementById("theme").textContent = (t==="dark") ? "light mode" : "dark mode";
}
document.getElementById("theme").onclick=()=>{
  themeOverride = (currentTheme()==="dark") ? "light" : "dark";
  applyTheme();
};
mql.addEventListener("change", ()=>{ if(!themeOverride) applyTheme(); });
applyTheme();

applyMode();
requestAnimationFrame(loop);
</script>
</body>
</html>
