<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D pose — __TITLE__</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; background:#0d0f13; color:#e6e9ef;
         font:14px/1.4 ui-sans-serif,system-ui,-apple-system,sans-serif; }
  #wrap { display:flex; flex-direction:column; height:100vh; }
  header { padding:10px 16px; border-bottom:1px solid #23262d; display:flex;
           gap:16px; align-items:baseline; flex-wrap:wrap; }
  header h1 { font-size:15px; margin:0; font-weight:600; }
  header .sub { color:#7d838f; font-size:12px; }
  #stage { flex:1; display:flex; min-height:0; }
  .pane { position:relative; min-width:0; min-height:0; flex:1; }
  #videoPane { display:none; border-right:1px solid #23262d; background:#000;
               align-items:center; justify-content:center; }
  #videoPane.on { display:flex; }
  #vidbox { position:relative; max-width:100%; max-height:100%; }
  video { display:block; max-width:100%; max-height:100%; }
  #ovl { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
  canvas#cv { width:100%; height:100%; display:block; cursor:grab; touch-action:none; }
  canvas#cv:active { cursor:grabbing; }
  .tag { position:absolute; top:10px; left:12px; font-size:11px; letter-spacing:.06em;
         text-transform:uppercase; color:#5d636e; pointer-events:none; }
  #hud { position:absolute; top:28px; left:12px; font-size:12px; color:#7d838f;
         pointer-events:none; line-height:1.7; }
  #hud b { color:#e6e9ef; font-variant-numeric:tabular-nums; font-weight:600; }
  #nodet { position:absolute; top:10px; right:14px; font-size:12px; color:#ff8a6b;
           display:none; }
  footer { border-top:1px solid #23262d; padding:10px 16px 14px;
           display:flex; flex-direction:column; gap:10px; }
  .row { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  button { background:#1a1d24; color:#e6e9ef; border:1px solid #2e323b;
           border-radius:6px; padding:6px 12px; font:inherit; cursor:pointer; }
  button:hover { background:#232730; }
  button.on { background:#2b6cb0; border-color:#3b82c4; }
  input[type=range] { flex:1; min-width:180px; accent-color:#4a9eff; }
  label { color:#9aa1ad; font-size:12px; display:flex; gap:6px; align-items:center; }
  select { background:#1a1d24; color:#e6e9ef; border:1px solid #2e323b;
           border-radius:6px; padding:5px 8px; font:inherit; }
  @media (max-width: 820px) { #stage { flex-direction:column; }
    #videoPane { border-right:none; border-bottom:1px solid #23262d; } }
</style>
</head>
<body>
<div id="wrap">
  <header>
    <h1>3D pose — __TITLE__</h1>
    <span class="sub">drag to orbit · scroll to zoom · shift-drag to pan · space to play · ←/→ step</span>
  </header>
  <div id="stage">
    <div class="pane" id="videoPane">
      <div id="vidbox">
        <video id="vid" playsinline muted preload="auto"></video>
        <canvas id="ovl"></canvas>
      </div>
      <div class="tag">source + 2D overlay</div>
    </div>
    <div class="pane">
      <canvas id="cv"></canvas>
      <div class="tag">3D world landmarks</div>
      <div id="hud"></div>
      <div id="nodet">no pose detected in this frame</div>
    </div>
  </div>
  <footer>
    <div class="row">
      <button id="play">▶ play</button>
      <input type="range" id="scrub" min="0" value="0" step="1">
      <span id="fcount" style="color:#7d838f;font-variant-numeric:tabular-nums"></span>
    </div>
    <div class="row">
      <label>speed
        <select id="speed">
          <option value="0.25">0.25×</option>
          <option value="0.5">0.5×</option>
          <option value="1" selected>1×</option>
          <option value="2">2×</option>
        </select>
      </label>
      <label>trail
        <select id="trailsel">
          <option value="">off</option>
          <option value="0">nose</option>
          <option value="15">left wrist</option>
          <option value="16">right wrist</option>
          <option value="27">left ankle</option>
          <option value="28">right ankle</option>
          <option value="com" selected>hip centre</option>
        </select>
      </label>
      <button id="solid" class="on">solid</button>
      <button id="ghost">ghosts</button>
      <button id="grid" class="on">floor</button>
      <button id="overlay" class="on">2D overlay</button>
      <button id="reset">reset view</button>
    </div>
  </footer>
</div>
<script>
const DATA = /*__DATA__*/null;

const GROUP_COLOR = {
  torso:"#c8cdd6", left_arm:"#4a9eff", right_arm:"#ff7a59",
  left_leg:"#41c7a8", right_leg:"#f2c14e", face:"#6b7280",
};
const EDGES = [];
for (const [g, list] of Object.entries(DATA.edges))
  for (const [a,b] of list) EDGES.push([a,b,GROUP_COLOR[g]]);

const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
const F = DATA.frames, N = F.length, FPS = DATA.fps;
const SCREEN = DATA.screen || null;
// True presentation time of each frame. Phone clips drop frames, so index/fps
// lies; every seek and every video->frame lookup goes through this instead.
const TIMES = DATA.times || Array.from({length:DATA.frames.length},(_,i)=>i/DATA.fps);
function frameAtTime(t){
  let lo=0, hi=TIMES.length-1;
  if(t<=TIMES[0]) return 0;
  if(t>=TIMES[hi]) return hi;
  while(lo<hi-1){ const mid=(lo+hi)>>1; if(TIMES[mid]<=t) lo=mid; else hi=mid; }
  return (t-TIMES[lo] <= TIMES[hi]-t) ? lo : hi;
}
const VIDSRC = DATA.video && DATA.video.src;

// ---- camera -------------------------------------------------------------
// Default = the source camera's own viewpoint: looking straight down world -z,
// so the 3D pane opens as a 3D rebuild of exactly what the video shows. Orbit
// away freely; "reset view" comes back here.
const HOME = { yaw:0, pitch:0, dist:2.2, panx:0, pany:0.1 };
let cam = {...HOME};

// Light in world space, up/front/camera-left, plus a dim fill from the opposite
// side so limbs facing away never go fully black.
const LIGHT = norm3([-0.45, 0.8, -0.6]);
const FILL  = norm3([0.5, 0.15, 0.5]);

function norm3(v){ const l=Math.hypot(v[0],v[1],v[2])||1; return [v[0]/l,v[1]/l,v[2]/l]; }
function sub3(a,b){ return [a[0]-b[0],a[1]-b[1],a[2]-b[2]]; }
function dot3(a,b){ return a[0]*b[0]+a[1]*b[1]+a[2]*b[2]; }
function cross3(a,b){ return [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]]; }

function shade(rgb, amt){
  // amt in [0,1]; below .5 darkens toward black, above brightens toward white
  const t = Math.max(0, Math.min(1, amt));
  return rgb.map(c => t < 0.5 ? c * (0.35 + 1.3*t)
                              : c + (255-c) * (t-0.5) * 0.9);
}
function css(rgb, a){ return `rgba(${rgb.map(c=>Math.round(Math.max(0,Math.min(255,c)))).join(",")},${a})`; }
function hex2rgb(h){ return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)]; }

function project(p, w, h) {
  // yaw about world Y, then pitch, then a simple perspective divide.
  const cy=Math.cos(cam.yaw), sy=Math.sin(cam.yaw);
  const cp=Math.cos(cam.pitch), sp=Math.sin(cam.pitch);
  let x = p[0]*cy - p[2]*sy;
  let z = p[0]*sy + p[2]*cy;
  let y = p[1]*cp - z*sp;
  z     = p[1]*sp + z*cp;
  const zc = z + cam.dist;
  if (zc <= 0.05) return null;
  const s = (h * 0.62) / zc;
  return [w/2 + (x + cam.panx)*s, h/2 - (y + cam.pany)*s, zc];
}

// ---- data helpers -------------------------------------------------------
function frameOK(i){ return DATA.detected[i] && F[i] && F[i][0] && F[i][0][0]!==null; }
function hipCentre(i){
  const f=F[i]; if(!f||!f[23]||!f[24]||f[23][0]===null) return null;
  return [(f[23][0]+f[24][0])/2,(f[23][1]+f[24][1])/2,(f[23][2]+f[24][2])/2];
}
// floor height = lowest foot point across the clip, so the grid sits under the athlete
let FLOOR = 0;
{ let lo=Infinity;
  for(let i=0;i<N;i++) if(frameOK(i)) for(const j of [29,30,31,32]) lo=Math.min(lo,F[i][j][1]);
  FLOOR = isFinite(lo) ? lo : -1; }

// ---- 3D drawing ---------------------------------------------------------
function drawGrid(w,h){
  const R=1.2, step=0.3;
  ctx.lineWidth=1;
  for(let k=-R;k<=R+1e-6;k+=step){
    for(const seg of [[[-R,FLOOR,k],[R,FLOOR,k]],[[k,FLOOR,-R],[k,FLOOR,R]]]){
      const a=project(seg[0],w,h), b=project(seg[1],w,h);
      if(!a||!b) continue;
      ctx.strokeStyle = Math.abs(k)<1e-6 ? "#2f3540" : "#1c2029";
      ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.stroke();
    }
  }
}

// Limb thickness in metres, roughly anatomical so the figure reads as a body.
const LIMB_R = { torso:0.075, left_arm:0.045, right_arm:0.045,
                 left_leg:0.062, right_leg:0.062, face:0.022 };
const BONE_R = {};   // "a-b" -> radius
for (const [g, list] of Object.entries(DATA.edges))
  for (const [a,b] of list) BONE_R[a+"-"+b] = LIMB_R[g];
// hands and feet taper down from the limb they hang off
for (const k of ["15-17","15-19","15-21","17-19","16-18","16-20","16-22","18-20"]) BONE_R[k]=0.028;
for (const k of ["27-29","27-31","29-31","28-30","28-32","30-32"]) BONE_R[k]=0.035;

const JOINT_R = {};  // sphere radius per landmark = thickest bone touching it
for (const [a,b,,key] of EDGES.map(e=>[e[0],e[1],e[2],e[0]+"-"+e[1]])) {
  JOINT_R[a]=Math.max(JOINT_R[a]||0, BONE_R[key]*0.92);
  JOINT_R[b]=Math.max(JOINT_R[b]||0, BONE_R[key]*0.92);
}

// Rotate a world point into camera space (same transform as project(), minus
// the perspective divide) so we can do lighting and depth sorting there.
function toCam(p){
  const cy=Math.cos(cam.yaw), sy=Math.sin(cam.yaw);
  const cp=Math.cos(cam.pitch), sp=Math.sin(cam.pitch);
  const x = p[0]*cy - p[2]*sy;
  let z = p[0]*sy + p[2]*cy;
  const y = p[1]*cp - z*sp;
  z = p[1]*sp + z*cp;
  return [x, y, z];
}

/* A capsule: draw it as a screen-space quad between two circles, filled with a
   gradient across the bone's perpendicular. The gradient stands in for the
   cylinder's surface normal sweeping from -90deg to +90deg, which is what makes
   the limb read as round rather than as a flat stroke. */
function capsule(pa, pb, rw, rgb, alpha, w, h){
  const A=project(pa,w,h), B=project(pb,w,h);
  if(!A||!B) return;
  const sA=(h*0.62)/A[2], sB=(h*0.62)/B[2];   // world->px at each end
  const ra=rw*sA, rb=rw*sB;
  let dx=B[0]-A[0], dy=B[1]-A[1];
  const len=Math.hypot(dx,dy) || 1e-6;
  dx/=len; dy/=len;
  const px=-dy, py=dx;                         // screen-space perpendicular

  // where the lit side falls, in perpendicular screen units
  const axis = norm3(sub3(toCam(pb), toCam(pa)));
  const Lc = toCam(LIGHT);
  // component of the light perpendicular to the bone axis, projected on screen
  const lp = norm3(sub3(Lc, axis.map(c=>c*dot3(Lc,axis))));
  const t = Math.max(-1, Math.min(1, lp[0]*px - lp[1]*py));
  const depthLit = Math.max(0, -lp[2]);        // light coming toward the camera

  const mx=(A[0]+B[0])/2, my=(A[1]+B[1])/2, rm=(ra+rb)/2;
  const g=ctx.createLinearGradient(mx-px*rm, my-py*rm, mx+px*rm, my+py*rm);
  const base = 0.5 + 0.42*t + 0.18*depthLit;
  g.addColorStop(0,    css(shade(rgb, base-0.42), alpha));
  g.addColorStop(0.45, css(shade(rgb, base+0.06), alpha));
  g.addColorStop(0.62, css(shade(rgb, base+0.20), alpha));   // specular band
  g.addColorStop(1,    css(shade(rgb, base-0.34), alpha));
  ctx.fillStyle=g;

  ctx.beginPath();
  ctx.arc(A[0],A[1],ra, Math.atan2(py,px), Math.atan2(py,px)+Math.PI, true);
  ctx.arc(B[0],B[1],rb, Math.atan2(py,px)+Math.PI, Math.atan2(py,px), true);
  ctx.closePath();
  ctx.fill();
}

/* A joint sphere: radial gradient with the highlight pushed toward the light. */
function sphere(p, rw, rgb, alpha, w, h){
  const S=project(p,w,h); if(!S) return;
  const r=rw*(h*0.62)/S[2];
  if(r<0.4) return;
  const Lc=norm3(toCam(LIGHT));
  const hx=S[0]+Lc[0]*r*0.45, hy=S[1]-Lc[1]*r*0.45;
  const g=ctx.createRadialGradient(hx,hy,r*0.08, S[0],S[1],r);
  const lit=0.5+0.3*Math.max(0,-Lc[2]);
  g.addColorStop(0,   css(shade(rgb, lit+0.30), alpha));
  g.addColorStop(0.6, css(shade(rgb, lit-0.02), alpha));
  g.addColorStop(1,   css(shade(rgb, lit-0.36), alpha));
  ctx.fillStyle=g;
  ctx.beginPath(); ctx.arc(S[0],S[1],r,0,7); ctx.fill();
}

/* Filled torso quad, shaded by its own surface normal — without this the trunk
   is a wire box and the figure never reads as solid. */
function torsoSlab(f, alpha, w, h){
  const idx=[11,12,24,23];
  if(idx.some(j=>!f[j]||f[j][0]===null)) return;
  const P=idx.map(j=>project(f[j],w,h));
  if(P.some(p=>!p)) return;
  const C=idx.map(j=>toCam(f[j]));
  let n=norm3(cross3(sub3(C[1],C[0]), sub3(C[3],C[0])));
  if(n[2]>0) n=n.map(c=>-c);                   // always face the camera
  const Lc=norm3(toCam(LIGHT)), Fc=norm3(toCam(FILL));
  const lit = 0.42 + 0.46*Math.max(0,dot3(n,Lc)) + 0.16*Math.max(0,dot3(n,Fc));
  ctx.fillStyle=css(shade(hex2rgb(GROUP_COLOR.torso), lit), alpha*0.95);
  ctx.beginPath(); ctx.moveTo(P[0][0],P[0][1]);
  for(let k=1;k<4;k++) ctx.lineTo(P[k][0],P[k][1]);
  ctx.closePath(); ctx.fill();
}

/* Contact shadow: the figure flattened onto the floor plane, so you can read
   height off the ground instead of guessing. */
function groundShadow(f, w, h){
  ctx.save(); ctx.globalCompositeOperation="multiply";
  for(let j=11;j<33;j++){
    const p=f[j]; if(!p||p[0]===null) continue;
    const S=project([p[0],FLOOR+0.005,p[2]],w,h); if(!S) continue;
    const drop=Math.max(0, p[1]-FLOOR);
    const r=(JOINT_R[j]||0.04)*3.2*(h*0.62)/S[2] * (1+drop*0.8);
    const a=0.30/(1+drop*2.2);
    const g=ctx.createRadialGradient(S[0],S[1],0,S[0],S[1],r);
    g.addColorStop(0,`rgba(0,0,0,${a})`); g.addColorStop(1,"rgba(0,0,0,0)");
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(S[0],S[1],r,0,7); ctx.fill();
  }
  ctx.restore();
}

function drawSkeleton(i,w,h,alpha){
  const f=F[i]; if(!f) return;

  if(!solid || alpha<1){                        // flat wireframe fallback + ghosts
    const P=f.map(p => (p && p[0]!==null) ? project(p,w,h) : null);
    ctx.lineCap="round";
    for(const [a,b,col] of EDGES){
      if(!P[a]||!P[b]) continue;
      const vis=Math.min(DATA.visibility[i][a],DATA.visibility[i][b]);
      ctx.strokeStyle=col; ctx.globalAlpha=alpha*(0.25+0.75*vis);
      ctx.lineWidth=alpha===1?4:2;
      ctx.beginPath(); ctx.moveTo(P[a][0],P[a][1]); ctx.lineTo(P[b][0],P[b][1]); ctx.stroke();
    }
    ctx.globalAlpha=1;
    return;
  }

  if(alpha===1) groundShadow(f,w,h);

  // Painter's algorithm: no depth buffer on a 2D canvas, so collect every
  // primitive with its camera depth and paint far-to-near.
  const prims=[];
  for(const [a,b,col] of EDGES){
    if(!f[a]||f[a][0]===null||!f[b]||f[b][0]===null) continue;
    const vis=Math.min(DATA.visibility[i][a],DATA.visibility[i][b]);
    if(vis<0.15) continue;
    const depth=(toCam(f[a])[2]+toCam(f[b])[2])/2;
    const rgb=hex2rgb(col), r=BONE_R[a+"-"+b]||0.04;
    prims.push({depth, draw:()=>capsule(f[a],f[b],r,rgb,alpha*(0.4+0.6*vis),w,h)});
  }
  for(let j=0;j<33;j++){
    if(!f[j]||f[j][0]===null||!JOINT_R[j]) continue;
    if(DATA.visibility[i][j]<0.15) continue;
    const grp=EDGES.find(e=>e[0]===j||e[1]===j);
    prims.push({depth:toCam(f[j])[2],
                draw:()=>sphere(f[j], JOINT_R[j], hex2rgb(grp?grp[2]:"#c8cdd6"),
                                alpha*(0.4+0.6*DATA.visibility[i][j]), w, h)});
  }
  const tC=[11,12,23,24].every(j=>f[j]&&f[j][0]!==null)
    ? [11,12,23,24].reduce((s,j)=>s+toCam(f[j])[2],0)/4 : null;
  if(tC!==null) prims.push({depth:tC+0.02, draw:()=>torsoSlab(f,alpha,w,h)});

  prims.sort((p,q)=>q.depth-p.depth);
  for(const p of prims) p.draw();
  ctx.globalAlpha=1;
}

function drawTrail(w,h,upto){
  const sel=document.getElementById("trailsel").value;
  if(sel==="") return;
  ctx.strokeStyle="#ffffff"; ctx.lineWidth=1.5; ctx.globalAlpha=0.55;
  ctx.beginPath(); let started=false;
  for(let i=0;i<=upto;i++){
    if(!frameOK(i)){ started=false; continue; }
    const p = sel==="com" ? hipCentre(i) : F[i][+sel];
    if(!p||p[0]===null){ started=false; continue; }
    const q=project(p,w,h); if(!q){ started=false; continue; }
    if(started) ctx.lineTo(q[0],q[1]); else { ctx.moveTo(q[0],q[1]); started=true; }
  }
  ctx.stroke(); ctx.globalAlpha=1;
}

// ---- 2D overlay on the video -------------------------------------------
const vid = document.getElementById("vid");
const ovl = document.getElementById("ovl"), octx = ovl.getContext("2d");
const videoPane = document.getElementById("videoPane");
let showOverlay = true, hasVideo = false;

if (VIDSRC) {
  hasVideo = true;
  vid.src = VIDSRC;
  videoPane.classList.add("on");
  vid.addEventListener("loadedmetadata", () => {
    // size the box to the video's aspect so the overlay lines up exactly
    document.getElementById("vidbox").style.aspectRatio =
      `${vid.videoWidth} / ${vid.videoHeight}`;
  });
  vid.addEventListener("error", () => {
    videoPane.classList.remove("on");
    document.getElementById("overlay").disabled = true;
    console.warn("video failed to load:", VIDSRC);
  });
} else {
  document.getElementById("overlay").style.display = "none";
}

function drawOverlay(i){
  const dpr=window.devicePixelRatio||1;
  const w=ovl.clientWidth, h=ovl.clientHeight;
  if(!w||!h) return;
  if(ovl.width!==w*dpr||ovl.height!==h*dpr){ ovl.width=w*dpr; ovl.height=h*dpr; }
  octx.setTransform(dpr,0,0,dpr,0,0);
  octx.clearRect(0,0,w,h);
  if(!showOverlay || !SCREEN || !SCREEN[i]) return;

  // landmarks are normalised to the source frame, and the <video> fills the
  // box at its native aspect ratio, so a straight multiply is correct.
  const P = SCREEN[i].map(p => (p && p[0]!==null) ? [p[0]*w, p[1]*h] : null);
  octx.lineCap="round";
  for(const [a,b,col] of EDGES){
    if(!P[a]||!P[b]) continue;
    const vis=Math.min(DATA.visibility[i][a],DATA.visibility[i][b]);
    if(vis<0.3) continue;
    octx.strokeStyle=col; octx.globalAlpha=0.35+0.65*vis;
    octx.lineWidth=Math.max(2, w/220);
    octx.beginPath(); octx.moveTo(P[a][0],P[a][1]); octx.lineTo(P[b][0],P[b][1]); octx.stroke();
  }
  octx.globalAlpha=1; octx.fillStyle="#fff";
  const r=Math.max(2, w/380);
  for(let j=11;j<P.length;j++){ if(!P[j]||DATA.visibility[i][j]<0.3) continue;
    octx.beginPath(); octx.arc(P[j][0],P[j][1],r,0,7); octx.fill(); }
}

// ---- render loop --------------------------------------------------------
let showGhosts=false, showGrid=true, solid=true, cur=0;

function render3D(){
  const dpr=window.devicePixelRatio||1;
  const w=cv.clientWidth, h=cv.clientHeight;
  if(cv.width!==w*dpr||cv.height!==h*dpr){ cv.width=w*dpr; cv.height=h*dpr; }
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,w,h);
  ctx.fillStyle="#0d0f13"; ctx.fillRect(0,0,w,h);

  if(showGrid) drawGrid(w,h);
  if(showGhosts) for(const d of [-8,-4,4,8]){
    const i=cur+d; if(i>=0&&i<N&&frameOK(i)) drawSkeleton(i,w,h,0.16);
  }
  drawTrail(w,h,cur);
  if(frameOK(cur)) drawSkeleton(cur,w,h,1);

  document.getElementById("nodet").style.display = frameOK(cur)?"none":"block";
  const hp=hipCentre(cur);
  document.getElementById("hud").innerHTML =
    `frame <b>${cur}</b> &nbsp; t=<b>${TIMES[cur].toFixed(2)}s</b>` +
    (hp?`<br>hip height <b>${(hp[1]-FLOOR).toFixed(2)}</b> m`:"");
}

// ---- playback -----------------------------------------------------------
// With a video loaded the <video> element is the clock and `cur` follows it;
// otherwise we advance frames off requestAnimationFrame.
const scrub=document.getElementById("scrub"), playBtn=document.getElementById("play");
scrub.max=N-1;
document.getElementById("fcount").textContent =
  `${N} frames · ${FPS.toFixed(1)} fps` + (DATA.model?` · ${DATA.model}`:"");

let playing=false, acc=0, last=0;

function setFrame(i){
  cur=Math.max(0,Math.min(N-1,i));
  scrub.value=cur;
  if(hasVideo && !playing) vid.currentTime = TIMES[cur];
}

function loop(t){
  if(playing){
    if(hasVideo && vid.readyState>=2){
      cur = frameAtTime(vid.currentTime);
      scrub.value=cur;
    } else {
      if(!last) last=t;
      acc += (t-last)/1000 * FPS * parseFloat(document.getElementById("speed").value);
      last=t;
      while(acc>=1){ cur=(cur+1)%N; acc-=1; scrub.value=cur; }
    }
  } else last=0;
  render3D();
  drawOverlay(cur);
  requestAnimationFrame(loop);
}

function setPlaying(v){
  playing=v; last=0;
  playBtn.textContent = v?"❚❚ pause":"▶ play";
  playBtn.classList.toggle("on",v);
  if(hasVideo){
    if(v){ if(vid.ended || cur>=N-1) vid.currentTime=0; vid.play().catch(()=>{}); }
    else vid.pause();
  }
}
if(hasVideo) vid.addEventListener("ended", ()=>setPlaying(false));

playBtn.onclick=()=>setPlaying(!playing);
scrub.oninput=()=>setFrame(+scrub.value);
document.getElementById("speed").onchange=e=>{ if(hasVideo) vid.playbackRate=parseFloat(e.target.value); };
document.getElementById("solid").onclick=e=>{ solid=!solid; e.target.classList.toggle("on",solid); };
document.getElementById("ghost").onclick=e=>{ showGhosts=!showGhosts; e.target.classList.toggle("on",showGhosts); };
document.getElementById("grid").onclick=e=>{ showGrid=!showGrid; e.target.classList.toggle("on",showGrid); };
document.getElementById("overlay").onclick=e=>{ showOverlay=!showOverlay; e.target.classList.toggle("on",showOverlay); };
document.getElementById("reset").onclick=()=>{ cam={...HOME}; };
addEventListener("keydown",e=>{
  if(e.target.tagName==="SELECT"||e.target.tagName==="INPUT") return;
  if(e.code==="Space"){ e.preventDefault(); setPlaying(!playing); }
  if(e.code==="ArrowRight"){ setPlaying(false); setFrame(cur+1); }
  if(e.code==="ArrowLeft"){ setPlaying(false); setFrame(cur-1); }
});

// ---- mouse --------------------------------------------------------------
let drag=null;
cv.addEventListener("pointerdown",e=>{ drag={x:e.clientX,y:e.clientY,shift:e.shiftKey}; cv.setPointerCapture(e.pointerId); });
cv.addEventListener("pointermove",e=>{
  if(!drag) return;
  const dx=e.clientX-drag.x, dy=e.clientY-drag.y;
  if(drag.shift){ cam.panx+=dx*0.004*cam.dist; cam.pany-=dy*0.004*cam.dist; }
  else { cam.yaw+=dx*0.008; cam.pitch=Math.max(-1.4,Math.min(1.4,cam.pitch+dy*0.008)); }
  drag.x=e.clientX; drag.y=e.clientY;
});
cv.addEventListener("pointerup",()=>drag=null);
cv.addEventListener("wheel",e=>{ e.preventDefault();
  cam.dist=Math.max(0.6,Math.min(12,cam.dist*Math.exp(e.deltaY*0.001))); },{passive:false});

requestAnimationFrame(loop);
</script>
</body>
</html>
